nst money=n=>new Intl.NumberFormat('fr-FR').format(n)+' FCFA',img=f=>RAW+f.split('/').map(encodeURIComponent).join('/');function category(f){let s=f.toLowerCase();if(/crampon|basket|chauss|ader-star|new-balance|vomero/.test(s))return'Chaussures';if(/montre/.test(s))return'Montres';if(/sac/.test(s))return'Sacs';if(/robe|jupe|femme/.test(s)&&!s.includes('sac'))return'Vetements femme';if(/ensemble|polo|t-shirt|summer/.test(s))return'Vetements homme';if(/bouilloire|etagere|armoire|serviette|seche-cheveux/.test(s))return'Maison';if(/parfum|coffret/.test(s))return'Accessoires';return'Autres'}function buildCats(){let a=['Tous','Chaussures','Montres','Vetements homme','Vetements femme','Sacs','Accessoires','Maison','Autres'];cats.innerHTML=a.map(c=>`<button class="cat ${c===cat?'active':''}" onclick="cat='${c}';buildCats();render()">${c}</button>`).join('')}function render(){let q=search.value.toLowerCase(),s=sort.value,a=products.filter(p=>(cat==='Tous'||p.cat===cat)&&p.name.toLowerCase().includes(q));if(s==='low')a.sort((x,y)=>x.price-y.price);if(s==='high')a.sort((x,y)=>y.price-x.price);productCount.textContent=a.length+' produit'+(a.length>1?'s':'')+' affiché'+(a.length>1?'s':'');productsEl.innerHTML=a.length?a.map(p=>`<article class="product"><div class="pic"><img src="${p.image}" alt="${p.name}" loading="lazy"></div><div class="info"><small>${p.cat}</small><h3>${p.name}</h3><div class="price">${money(p.price)}</div><button class="add" onclick="add(${p.i})">Ajouter au panier</button></div></article>`).join(''):'<div class="empty">Aucun produit trouvé.</div>'}let productsEl=document.getElementById('products');function add(i){let p=products[i],x=cart.find(x=>x.i===i);if(x)x.qty++;else cart.push({i,qty:1});count.textContent=cart.reduce((a,x)=>a+x.qty,0);localStorage.setItem('cart',JSON.stringify(cart));alert('Produit ajouté au panier.')}function openCart(){let t=cart.reduce((a,x)=>a+products[x.i].price*x.qty,0);let msg=cart.map(x=>'- '+products[x.i].name+' x'+x.qty+' | '+
