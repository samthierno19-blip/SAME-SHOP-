<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20170f"><title>SAME-SHOP 🛍️</title><style>:root{--d:#20170f;--b:#9a5a16;--l:#eadfd3;--m:#746b63}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:var(--d)}.top{background:var(--d);color:#fff;text-align:center;padding:8px;font-size:13px}.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--l);padding:10px 5%;display:flex;justify-content:space-between;align-items:center;z-index:5}.logo{width:90px;height:48px;object-fit:contain}.section{max-width:1200px;margin:auto;padding:30px 5%}.hero{background:#fffaf4;padding:45px 5%;text-align:center}h1{font-size:clamp(34px,6vw,60px);margin:10px 0}.hero span,.price{color:var(--b)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{padding:12px;border:1px solid var(--l);border-radius:11px;font:inherit}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.cat{border:1px solid var(--l);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.cat.active{background:var(--d);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product{border:1px solid var(--l);border-radius:16px;overflow:hidden;background:#fff}.pic{height:230px;background:#f7f2ec;padding:8px}.pic img{width:100%;height:100%;object-fit:contain;border-radius:10px}.info{padding:13px}.info h3{font-size:15px;line-height:1.25;margin:5px 0}.price{font-size:18px;font-weight:900}.empty{text-align:center;padding:30px;color:var(--m)}@media(max-width:700px){.pic{height:185px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}} </style></head><body><div class="top">🇸🇳 Livraison au Sénégal • Commande simple par WhatsApp</div><nav class="nav"><img class="logo" src="https://raw.githubusercontent.com/samthierno19-blip/SAME-SHOP-/main/logo.jpg" alt="SAME-SHOP"><b>🛍️ SAME-SHOP</b></nav><section class="hero"><h1>Tout at?'active':''}" onclick="cat='${c}';buildCats();render()">${c}</button>`).join('')}function render(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('sort').value,a=data.filter(p=>(cat==='Tous'||category(p[0])===cat)&&p[1].toLowerCase().includes(q));if(s==='low')a.sort((x,y)=>x[2]-y[2]);if(s==='high')a.sort((x,y)=>y[2]-x[2]);document.getElementById('count').textContent=a.length+' produit'+(a.length>1?'s':'')+' affiché'+(a.length>1?'s':'');document.getElementById('products').innerHTML=a.map(p=>`<article class="product"><div class="pic"><img src="${RAW+encodeURIComponent(p[0]).replace(/%2F/g,'/')}" loading="lazy" alt="${p[1]}"></div><div class="info"><small>${category(p[0])}</small><h3>${p[1]}</h3><div class="price">${new Intl.NumberFormat('fr-FR').format(p[2])} FCFA</div></div></article>`).join('')}document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;buildCats();render();</script></body></html>
