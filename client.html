<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20170f"><title>SAME-SHOP — Espace client</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#20170f;background:#fffaf4}header{background:#20170f;color:#fff;padding:10px 5%;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none;font-weight:700}.logo{width:85px;height:45px;object-fit:contain;background:#fff;border-radius:8px}main{max-width:1100px;margin:auto;padding:25px 5%}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.nav button{border:1px solid #eadfd3;background:#fff;color:#20170f;border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer}.nav button.active{background:#20170f;color:#fff}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.box{background:#fff;border:1px solid #eadfd3;border-radius:18px;padding:20px}.box h2{margin-top:0}button{border:0;border-radius:10px;padding:11px 15px;background:#20170f;color:#fff;font-weight:800;cursor:pointer}.danger{background:#9a5a16}.empty{color:#746b63;padding:15px 0}.stars{color:#9a5a16;font-size:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="index.html"><img src="logo.jpg" class="logo" alt="SAME-SHOP"></a><a href="index.html">🛍️ Boutique</a></header><main><h1>👤 Mon espace client</h1><div class="nav"><button class="active" onclick="showPanel('profile',this)">👤 Profil</button><button onclick="showPanel('orders',this)">📦 Mes commandes</button><button onclick="showPanel('reviews',this)">⭐ Mes avis</button><button onclick="location.href='index.html#boutique'">🛒 Boutique</button></div><section id="profile" class="panel active"><div class="box"><h2>Mon profil</h2><p><b>Nom :</b> <span id="name">—</span></p><p><b>E-mail :</b> <span id="email">—</span></p><p><b>Téléphone :</b> <span id="phone">—</span></p><button onclick="logout()" class="danger">Déconnexion</button></div></section><section id="orders" class="panel"><div class="box"><h2>📦 Mes commandes</h2><div id="ordersList">Chargement…</div></div></section><section id="reviews" class="panel"><div class="box"><h2>⭐ Mes avis</h2><div id="reviewsList">Chargement…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>async function user(){const{data}=await sameShopSupabase.auth.getUser();if(!data.user){location.href='auth.html';return null}return data.user}function showPanel(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function load(){const u=await user();if(!u)return;const{data:p}=await sameShopSupabase.from('profiles').select('full_name,phone').eq('id',u.id).maybeSingle();document.getElementById('name').textContent=p?.full_name||u.user_metadata?.full_name||'—';document.getElementById('email').textContent=u.email||'—';document.getElementById('phone').textContent=p?.phone||u.user_metadata?.phone||'—';const o=await sameShopSupabase.from('orders').select('id,order_number,status,total_fcfa,created_at,order_items(product_name,quantity,unit_price_fcfa,image_url)').eq('user_id',u.id).order('created_at',{ascending:false});document.getElementById('ordersList').innerHTML=o.error?'<p class="empty">Impossible de charger les commandes.</p>':o.data.length?o.data.map(x=>`<article style="border-top:1px solid #eadfd3;padding:14px 0"><b>Commande ${x.order_number||x.id}</b><div>${new Date(x.created_at).toLocaleDateString('fr-FR')} • ${x.status||'En attente'}</div><div>${(x.order_items||[]).map(i=>`${i.product_name} × ${i.quantity}`).join('<br>')}</div><strong>${Number(x.total_fcfa||0).toLocaleString('fr-FR')} FCFA</strong></article>`).join(''):'<p class="empty">Vous n’avez encore aucune commande.</p>';const r=await sameShopSupabase.from('reviews').select('*').eq('user_id',u.id).order('created_at',{ascending:false});document.getElementById('reviewsList').innerHTML=r.error?'<p class="empty">Impossible de charger vos avis.</p>':r.data.length?r.data.map(x=>`<article style="border-top:1px solid #eadfd3;padding:14px 0"><div class="stars">${'★'.repeat(Math.max(0,Math.min(5,Number(x.rating)||0)))}${'☆'.repeat(5-Math.max(0,Math.min(5,Number(x.rating)||0)))}</div><b>${x.product_key||'Produit'}</b><p>${x.comment||''}</p></article>`).join(''):'<p class="empty">Vous n’avez encore laissé aucun avis.</p>'}async function logout(){await sameShopSupabase.auth.signOut();location.href='index.html'}load();</script></body></html>
