<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20170f"><title>SAME-SHOP — Mon compte</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#fffaf4;color:#20170f}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(460px,100%);background:#fff;padding:28px;border-radius:24px;box-shadow:0 15px 50px #20170f18;border:1px solid #eadfd3}.logo{width:110px;height:58px;object-fit:contain;display:block;margin:auto}h1{text-align:center;margin:14px 0 6px}.sub{text-align:center;color:#746b63;margin-bottom:24px}input{width:100%;padding:14px;margin:6px 0;border:1px solid #eadfd3;border-radius:12px;outline:none}button{width:100%;padding:14px;border:0;border-radius:12px;background:#20170f;color:#fff;font-weight:800;margin-top:10px;cursor:pointer}.alt{background:#9a5a16}.msg{margin-top:15px;text-align:center;font-size:14px;line-height:1.5}a{color:#9a5a16;font-weight:700}.hidden{display:none}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.tabs button{margin:0;background:#f1ebe4;color:#20170f}.tabs button.active{background:#20170f;color:#fff}</style></head><body><div class="wrap"><div class="card"><img src="logo.jpg" class="logo" alt="SAME-SHOP"><h1 id="title">Créer mon compte</h1><p class="sub">Votre espace client SAME-SHOP 🛍️</p><div class="tabs"><button id="signupTab" class="active" type="button">Créer un compte</button><button id="loginTab" type="button">Se connecter</button></div><form id="form"><div id="signupFields"><input id="name" placeholder="Nom complet" autocomplete="name"><input id="phone" placeholder="Téléphone" autocomplete="tel"></div><input id="email" type="email" placeholder="Adresse e-mail" required autocomplete="email"><input id="password" type="password" placeholder="Mot de passe" minlength="6" required autocomplete="current-password"><button type="submit" id="submit">Créer mon compte</button></form><div class="msg" id="message"></div><p style="text-align:center;margin-top:20px"><a href="index.html">← Retour à la boutique</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
